name: Build TierTagger Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Auto-detect correct Fabric API version
        run: |
          python3 - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re

          url = "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"
          with urllib.request.urlopen(url) as r:
              tree = ET.parse(r)

          versions = [v.text for v in tree.findall('.//version')]
          mc_versions = [v for v in versions if '+1.21.1' in v]

          if mc_versions:
              latest = mc_versions[-1]
              print(f"Available: {mc_versions}")
              print(f"Using: {latest}")
              content = open('gradle.properties').read()
              content = re.sub(r'fabric_version=.*', f'fabric_version={latest}', content)
              open('gradle.properties', 'w').write(content)
          else:
              print("No 1.21.1 versions found!")
          EOF

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Build with Gradle
        run: gradle build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiertagger-mod
          path: build/libs/*.jar
          if-no-files-found: error
