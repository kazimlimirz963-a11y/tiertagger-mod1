name: Build TierTagger Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -sSL "https://raw.githubusercontent.com/FabricMC/fabric-example-mod/1.21.1/gradlew" -o gradlew
          curl -sSL "https://raw.githubusercontent.com/FabricMC/fabric-example-mod/1.21.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          curl -sSL "https://raw.githubusercontent.com/FabricMC/fabric-example-mod/1.21.1/gradle/wrapper/gradle-wrapper.properties" -o gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

     - name: Upload JAR artifact
  uses: actions/upload-artifact@v4
  with:
    name: tiertagger-mod
    path: |
      build/libs/*.jar
      !build/libs/*-dev.jar
      !build/libs/*-sources.jar
    if-no-files-found: error
